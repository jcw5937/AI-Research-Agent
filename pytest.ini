[pytest]
markers =
    live: hits real APIs (Anthropic, arXiv) and costs money; opt-in only, not run by default
; Default `pytest` (no path) only collects tests/unit. tests/live requires an
; explicit path (e.g. `pytest tests/live`) even when ANTHROPIC_API_KEY is set,
; since a real key may already be present in the environment/.env.
testpaths = tests/unit
